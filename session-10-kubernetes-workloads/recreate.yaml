apiVersion: apps/v1
kind: Deployment
metadata: {name: recreate-demo}
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector: {matchLabels: {app: recreate-demo}}
  template:
    metadata: {labels: {app: recreate-demo}}
    spec:
      containers:
        - {name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}
