apiVersion: v1
kind: ConfigMap
metadata: {name: demo-config}
data: {GREETING: Hello from ConfigMap}
---
apiVersion: v1
kind: Pod
metadata: {name: config-demo}
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: [sh, -c, 'echo "$GREETING"; sleep 3600']
      envFrom: [{configMapRef: {name: demo-config}}]
