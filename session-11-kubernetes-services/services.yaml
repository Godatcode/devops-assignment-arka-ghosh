apiVersion: apps/v1
kind: Deployment
metadata: {name: service-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: service-demo}}
  template:
    metadata: {labels: {app: service-demo}}
    spec: {containers: [{name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: demo-clusterip}
spec:
  type: ClusterIP
  selector: {app: service-demo}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: demo-nodeport}
spec:
  type: NodePort
  selector: {app: service-demo}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata: {name: demo-loadbalancer}
spec:
  type: LoadBalancer
  selector: {app: service-demo}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: demo-externalname}
spec:
  type: ExternalName
  externalName: example.com
---
apiVersion: v1
kind: Service
metadata: {name: demo-headless}
spec:
  clusterIP: None
  selector: {app: service-demo}
  ports: [{port: 80, targetPort: 80}]
