apiVersion: v1
kind: Secret
metadata: {name: demo-secret}
type: Opaque
stringData: {DEMO_PASSWORD: replace-locally}
---
apiVersion: v1
kind: Pod
metadata: {name: secret-demo}
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: [sh, -c, 'test -n "$DEMO_PASSWORD" && echo secret-present; sleep 3600']
      envFrom: [{secretRef: {name: demo-secret}}]
