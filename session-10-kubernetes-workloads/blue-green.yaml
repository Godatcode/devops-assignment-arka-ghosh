apiVersion: apps/v1
kind: Deployment
metadata: {name: blue}
spec:
  replicas: 2
  selector: {matchLabels: {app: color-demo, version: blue}}
  template:
    metadata: {labels: {app: color-demo, version: blue}}
    spec: {containers: [{name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: green}
spec:
  replicas: 2
  selector: {matchLabels: {app: color-demo, version: green}}
  template:
    metadata: {labels: {app: color-demo, version: green}}
    spec: {containers: [{name: web, image: nginx:1.28-alpine, ports: [{containerPort: 80}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: color-demo}
spec:
  selector: {app: color-demo, version: blue}
  ports: [{port: 80, targetPort: 80}]
